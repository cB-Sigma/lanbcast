name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build without cgo
        shell: bash
        run: CGO_ENABLED=0 go build ./...
      - name: cross-build for the BSDs
        if: runner.os == 'Linux'
        run: |
          GOOS=freebsd go vet ./...
          GOOS=openbsd go vet ./...
      - name: test
        # TestProbeOnHost probes the runner's own interfaces and logs what
        # it sees; TestResponderLoopback checks the packet-information
        # code of each system.
        run: go test -race -v ./...
      - name: staticcheck
        if: runner.os == 'Linux'
        continue-on-error: true
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  netns:
    # Three LANs and a VPN-like route built with network namespaces
    # (netns_linux_test.go); needs root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: multi-LAN test
        run: |
          go test -c -race -o lanbcast.test .
          sudo SIGMA_NETNS=1 ./lanbcast.test -test.run 'Netns' -test.v
